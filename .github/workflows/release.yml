name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            desktop/package-lock.json

      - name: Sync desktop version from tag
        working-directory: desktop
        shell: bash
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid version derived from tag: $VERSION"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install and build core
        working-directory: core
        run: |
          npm ci
          npm run build

      - name: Install and build desktop
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Package Windows app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # --publish never: upload ourselves so we can include latest.yml + blockmap
        run: npx electron-builder --win --publish never

      - name: Upload build artifacts (debug)
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
